<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc" lang="zh-Hans" font-family="SF Pro Text, system-ui, sans-serif">
  <title id="title">EqualizerAU 菜单栏与简体中文界面预览</title>
  <desc id="desc">包含 EqualizerAU 三推子图标、绿色状态点和中文右键菜单的 macOS 菜单栏画面。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7e2ee"/><stop offset=".55" stop-color="#bfcddd"/><stop offset="1" stop-color="#9eafc1"/></linearGradient>
    <filter id="menuShadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#182331" flood-opacity=".28"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1440" height="720" fill="url(#wall)"/>
  <circle cx="250" cy="430" r="210" fill="#dce8f2" opacity=".5" filter="url(#blur)"/><circle cx="1180" cy="530" r="240" fill="#7b91a8" opacity=".22" filter="url(#blur)"/>
  <rect width="1440" height="38" fill="#f6f7f8" fill-opacity=".84"/>
  <g font-size="14" font-weight="600" fill="#17181a"><text x="18" y="25">EqualizerAU</text><text x="122" y="25">文件</text><text x="170" y="25">编辑</text><text x="218" y="25">音频</text><text x="266" y="25">窗口</text></g>
  <g transform="translate(1204 6)" stroke="#17181a" fill="#17181a" stroke-linecap="round">
    <path d="M3 2v23M11 2v23M19 2v23" stroke-width="1.5"/><rect x="0" y="7" width="6" height="4" rx="1.3"/><rect x="8" y="16" width="6" height="4" rx="1.3"/><rect x="16" y="10" width="6" height="4" rx="1.3"/>
    <circle cx="22" cy="24" r="4.5" fill="#34c759" stroke="white" stroke-width="1"/>
  </g>
  <g fill="#212225" font-size="13"><rect x="1256" y="14" width="20" height="10" rx="2" fill="none" stroke="#212225"/><rect x="1277" y="17" width="2" height="4" rx="1"/><rect x="1259" y="17" width="14" height="4" rx="1"/><text x="1300" y="25">100%</text><text x="1360" y="25">21:18</text></g>
  <g filter="url(#menuShadow)"><rect x="1010" y="48" width="350" height="280" rx="14" fill="#f7f7f8" fill-opacity=".96"/></g>
  <g lang="zh-Hans" fill="#1f2023">
    <text x="1038" y="82" font-size="14" fill="#858991">音频处理已启用</text>
    <text x="1038" y="126" font-size="15">打开 EqualizerAU</text>
    <text x="1024" y="170" font-size="15">✓</text><text x="1048" y="170" font-size="15">音频处理</text>
    <line x1="1026" y1="192" x2="1344" y2="192" stroke="#d9dadd"/>
    <text x="1038" y="228" font-size="15">语言</text><text x="1327" y="228" text-anchor="end" font-size="18" fill="#777b82">›</text>
    <text x="1038" y="280" font-size="15">退出 EqualizerAU</text><text x="1318" y="280" text-anchor="end" font-size="13" fill="#777b82">⌘Q</text>
  </g>
  <g filter="url(#menuShadow)"><rect x="696" y="192" width="300" height="182" rx="13" fill="#f7f7f8" fill-opacity=".97"/></g>
  <g lang="zh-Hans" font-size="14" fill="#222326"><text x="724" y="228">跟随系统</text><text x="724" y="272" lang="en">English</text><rect x="708" y="290" width="272" height="42" rx="8" fill="#0a84ff"/><text x="722" y="317" fill="white">✓</text><text x="746" y="317" fill="white">简体中文</text></g>
</svg>
