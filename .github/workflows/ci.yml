name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  test:
    name: Build & Test (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Lint project and plist
        run: plutil -lint EqualizerAU.xcodeproj/project.pbxproj EqualizerAU/Resources/Info.plist EqualizerAUM1/Resources/Info.plist

      - name: Shell syntax checks
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in scripts/*.zsh; do zsh -n "$script"; done

      - name: Run M1 runtime tests
        run: |
          xcodebuild \
            -project EqualizerAU.xcodeproj \
            -scheme EqualizerAUM1 \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test
